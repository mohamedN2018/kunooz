{% extends "base.html" %}
{% block title %}الصفحة غير موجودة - كنوز{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-4 py-20 text-center">
    <p class="text-7xl font-extrabold text-blue-600 dark:text-blue-400">404</p>
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100 mt-4">الصفحة غير موجودة</h1>
    <p class="text-gray-600 dark:text-gray-300 mt-3">ربما تم نقل الصفحة أو حذفها. جرّب البحث عمّا تريد:</p>
    <form method="get" action="{% url 'search' %}" class="mt-6 flex max-w-md mx-auto" role="search">
        <label for="err-q" class="sr-only">بحث</label>
        <input id="err-q" type="search" name="q" placeholder="ابحث في كنوز..." class="flex-grow px-4 py-3 rounded-r-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-800">
        <button type="submit" class="px-5 py-3 rounded-l-lg bg-blue-600 text-white hover:bg-blue-700">بحث</button>
    </form>
    <a href="{% url 'home' %}" class="inline-block mt-6 text-blue-600 dark:text-blue-400 hover:underline">العودة للرئيسية</a>
</section>
{% endblock %}
