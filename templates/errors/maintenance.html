<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>الموقع تحت الصيانة - {{ url_media.site_name|default:"كنوز" }}</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --accent: #16a34a; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--bg); color: var(--text); font-family: 'Cairo', Tahoma, sans-serif; }
        .card { background: var(--card); max-width: 480px; width: 100%; padding: 40px 28px; border-radius: 20px; text-align: center;
                box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        .icon { font-size: 56px; line-height: 1; }
        h1 { font-size: 1.6rem; margin: 16px 0 8px; }
        p { color: var(--muted); line-height: 1.8; margin: 0; }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">🛠️</div>
        <h1>نعمل على تحسين الموقع</h1>
        <p>{{ url_media.site_name|default:"كنوز" }} تحت الصيانة حالياً وسيعود خلال وقت قصير. شكراً لصبرك.</p>
        {% if url_media.contact_email %}<p style="margin-top:12px">للتواصل: <a href="mailto:{{ url_media.contact_email }}">{{ url_media.contact_email }}</a></p>{% endif %}
    </main>
</body>
</html>
