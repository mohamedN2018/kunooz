# يعمل تلقائياً مع كل push و pull request: فحص Django + الـ migrations + كل الاختبارات على Python 3.11 و PostgreSQL 17
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kunooz
          POSTGRES_PASSWORD: kunooz-ci-only
          POSTGRES_DB: kunooz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kunooz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MY_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnop
      LOCAL: "False"
      DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: kunooz
      DB_USER: kunooz
      DB_PASSWORD: kunooz-ci-only
      DB_HOST: localhost
      DB_PORT: "5432"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Pipfile.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv requirements > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt

      - name: Django check
        run: python manage.py check --fail-level ERROR

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (PostgreSQL)
        run: python manage.py test core advertisements analytics --noinput -v 2

      - name: collectstatic
        run: python manage.py collectstatic --noinput --verbosity 0

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t kunooz:ci .
