services:
  kunooz:
    build: .
    restart: always
    volumes:
      # الصور المرفوعة في volume دائم: Dokploy يحذف مجلد الكود ويعيد استنساخه عند كل نشر
      # (كان ./:/usr/src/app فكانت الصور المرفوعة من لوحة التحكم تضيع مع كل نشر).
      - kunooz-media:/usr/src/app/media
      - django-folder:/s3files
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: kunooz-db
      DB_PORT: 5432
      LOCAL: "False"
    command: gunicorn --chdir /usr/src/app --timeout 320 --workers ${GUNICORN_WORKERS:-25} --access-logfile /dev/stdout --error-logfile /dev/stderr --bind :80 kunooz.wsgi:application
    depends_on:
      - kunooz-db

  kunooz-db:
    image: postgres:17
    expose:
      - 5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_MAX_CONNECTIONS: 2000
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgresql_data:
  django-folder:
  kunooz-media:
